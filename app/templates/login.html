<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CoreCast</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="card login-card p-4">
            <div class="card-body">
                <h3 class="text-center mb-1" style="color: var(--cc-azul-escuro); font-weight: 700;">CoreCast</h3>
                <p class="text-center text-muted mb-4">Gestao de Atendimentos &amp; SLA</p>

                {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" name="email" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" name="senha" required>
                    </div>
                    <button type="submit" class="btn btn-corecast w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
